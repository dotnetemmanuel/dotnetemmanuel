name: Latest blog post workflow

# Run from the Actions tab when a new post is published. Hourly polling was churning through runs
# to pick up a handful of posts a year.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          max_post_count: "4"
          feed_list: "https://dev.to/feed/dotnet_emmanuel"
          commit_message: "chore: update blog posts"
